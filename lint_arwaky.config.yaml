# ═══════════════════════════════════════════════════════════════════════
# lint_arwaky.config.yaml — Unified configuration for all languages
# Replaces: lint_arwaky.config.rust.yaml, lint_arwaky.config.python.yaml,
#           lint_arwaky.config.typescript.yaml, lint_arwaky.config.javascript.yaml
# ═══════════════════════════════════════════════════════════════════════

thresholds:
  score: 100.0
  complexity: 15

# ─── Adapters ─────────────────────────────────────────────────────────
# All adapters listed. The system auto-filters by detected language.
adapters:
  # Rust
  - name: "clippy"
    weight: 1.0
  - name: "rustfmt"
    weight: 1.0
  - name: "cargo-audit"
    weight: 1.0
  # Python
  - name: "ruff"
    weight: 1.0
  - name: "mypy"
    weight: 1.0
  - name: "bandit"
    weight: 1.0
  # TypeScript/JavaScript
  - name: "eslint"
    weight: 1.0
  - name: "tsc"
    weight: 1.0
  - name: "prettier"
    weight: 1.0
  # Internal
  - name: "architecture"
    weight: 3.0

ignored_rules: []

ignored_paths:
  - "/target"
  - "/.git"
  - "/node_modules"
  - ".min.js"
  - ".min.css"
  - "/.dsc_cache"
  - "/tests"
  - "/benches"
  - "./output"
  - "/dist"
  - "/build"
  - "/.tsbuildinfo"
  - "/.next"
  - "/coverage"
  - "/__pycache__"
  - "/.venv"
  - "/venv"
  - "/.mypy_cache"
  - "/.ruff_cache"
  - "webview/"
  - "build.rs"
  - "/build.rs"
  - "**/build.rs"

# ─── Per-language overrides ───────────────────────────────────────────
# These provide config templates for `init` and are used by the scanner
# to resolve language-specific exceptions and forbidden bypass patterns.
languages:
  rust:
    exceptions: ["main.rs", "lib.rs", "mod.rs"]
    forbidden_bypass:
      - "#[allow("
      - "unwrap"
      - "expect"
      - "panic"
      - "todo"
      - "unimplemented"
      - "unreachable"
      - "noqa"
      - "type: ignore"
      - "eslint-disable"
      - "ts-ignore"
      - "ts-expect-error"
      - "pylint: disable"
    entry_points: []
    suffix_flexible_utility: []
    suffix_flexible_capabilities: []

  python:
    exceptions: ["__init__.py", "__main__.py", "main.py"]
    forbidden_bypass:
      - "# noqa"
      - "# type: ignore"
      - "# fmt: off"
      - "# ruff: noqa"
      - "# pylint: disable"
      - "Any"
      - "except:"
      - "pass"
    entry_points: []
  typescript:
    exceptions:
      - "__init__.py"
      - "__main__.py"
      - "main.py"
      - "cli_main_entry.py"
      - "mcp_main_entry.py"
      - "tui_main_entry.py"
      - "index.js"
      - "index.ts"
      - "App.tsx"
      - "index.tsx"
      - "types.ts"
      - "DependencyGraph.tsx"
      - "ViolationList.tsx"
      - "LayerBadge.tsx"
      - "useGraphData.ts"
    forbidden_bypass:
      - "// @ts-ignore"
      - "// @ts-expect-error"
      - "// @ts-nocheck"
      - "// eslint-disable"
      - "eslint-disable-next-line"
      - "any"
      - "as any"
    entry_points:
      - "index.ts"
      - "index.js"
      - "index.tsx"
      - "index.jsx"
      - "main.ts"
      - "main.js"
    suffix_flexible_utility:
      - "parser"
      - "splitter"
      - "trimmer"
      - "slugifier"
      - "sanitizer"
      - "normalizer"
      - "extractor"
      - "replacer"
      - "converter"
      - "counter"
      - "resolver"
      - "detector"
      - "builder"
      - "joiner"
      - "serializer"
      - "deserializer"
      - "encoder"
      - "decoder"
      - "hasher"
      - "generator"
      - "formatter"
      - "comparator"
      - "differ"
      - "matcher"
      - "checker"
      - "calculator"
      - "mapper"
      - "merger"
      - "grouper"
      - "sorter"
      - "deduplicator"
      - "printer"
    suffix_flexible_capabilities:
      - "analyzer"
      - "checker"
      - "processor"
      - "evaluator"
      - "resolver"
      - "validator"
      - "formatter"
      - "executor"
      - "transformer"
      - "calculator"
      - "builder"
      - "compiler"
      - "aggregator"
      - "classifier"
      - "extractor"
      - "reporter"
      - "mapper"
      - "filter"
      - "collector"
      - "comparator"
      - "scorer"
      - "inspector"
      - "reviewer"
      - "assessor"
      - "auditor"
      - "actions"
      - "helper"

# ─── Architecture rules (superset, shared across all languages) ───────
architecture:
  enabled: true
  rules:
    # ─── AES100: Naming ───
    AES101:
      enabled: true
      scope:
        [
          "taxonomy",
          "utility",
          "contract",
          "capabilities",
          "agent",
          "surface",
          "root",
        ]
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "build.rs",
          "__init__.py",
          "__main__.py",
          "main.py",
          "index.js",
          "index.ts",
          "App.tsx",
          "index.tsx",
          "types.ts",
          "DependencyGraph.tsx",
          "ViolationList.tsx",
          "LayerBadge.tsx",
          "useGraphData.ts",
          "root_esbuild_entry.js",
        ]

    AES102:
      enabled: true
      scope:
        [
          "taxonomy",
          "utility",
          "contract",
          "capabilities",
          "agent",
          "surface",
          "root",
        ]
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "build.rs",
          "__init__.py",
          "main.py",
          "lib.py",
          "index.js",
          "index.ts",
          "main.js",
          "main.ts",
          "root_entry_container.rs",
          "agent_filesystem_orchestrator_helpers.rs",
          "root_config_defaults.rs",
        ]
      layers:
        taxonomy:
          suffix:
            - strict: ["vo", "entity", "error", "event", "constant"]
        contract:
          suffix:
            - strict: ["protocol", "aggregate"]
        utility:
          suffix:
            - flexible: []
            - forbidden:
                [
                  "vo",
                  "entity",
                  "error",
                  "event",
                  "constant",
                  "protocol",
                  "aggregate",
                ]
        capabilities:
          suffix:
            - flexible: []
            - forbidden:
                [
                  "vo",
                  "entity",
                  "error",
                  "event",
                  "constant",
                  "constants",
                  "protocol",
                  "aggregate",
                  "utility",
                ]
        agent:
          suffix:
            - strict: ["orchestrator"]
        surface:
          suffix:
            - strict:
                [
                  "command",
                  "controller",
                  "page",
                  "view",
                  "component",
                  "router",
                  "layout",
                  "hook",
                  "store",
                  "action",
                  "screen",
                ]
        root:
          suffix:
            - strict: ["entry", "container"]

    # ─── AES200: Import ───
    AES201:
      enabled: true
      scope:
        [
          "taxonomy",
          "utility",
          "contract",
          "capabilities",
          "agent",
          "surface",
          "root",
        ]
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "__init__.py",
          "__main__.py",
          "main.py",
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "main.ts",
          "main.js",
          "cli_main_entry.ts",
          "cli_main_entry.js",
          "mcp_main_entry.ts",
          "mcp_main_entry.js",
          "tui_main_entry.ts",
          "tui_main_entry.js",
          "utility_ast_python.rs",
          "utility_ast_rust.rs",
          "utility_ast_typescript.rs",
          "utility_import_extractor.rs",
          "utility_config_defaults.rs",
          "agent_config_orchestrator.rs",
          "capabilities_orchestration_helpers.rs",
        ]
      conditions:
        - scope: "taxonomy(vo)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "taxonomy(entity,error,event)"
          allowed: ["taxonomy"]
          mandatory: ["taxonomy(vo|constant)"]
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "taxonomy(constant)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "utility"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden: ["agent", "surface", "contract", "capabilities", "root", "utility"]

        - scope: "contract(protocol)"
          allowed: ["taxonomy", "contract"]
          mandatory: ["taxonomy"]
          forbidden:
            ["agent", "surface", "capabilities", "contract(aggregate)", "root"]

        - scope: "contract(aggregate)"
          allowed: ["taxonomy", "contract"]
          mandatory: ["taxonomy"]
          forbidden: ["agent", "surface", "capabilities", "root"]
          forbidden_inheritance: ["contract(protocol)"]

        - scope: "capabilities"
          allowed: ["taxonomy", "contract", "utility"]
          mandatory: ["taxonomy", "contract(protocol)"]
          forbidden: ["surface", "agent", "capabilities", "root"]
          allowed_imports:
            - layer: "taxonomy"
              purpose: "implement"
            - layer: "contract(protocol)"
              purpose: "implement"
            - layer: "utility"
              purpose: "call"

        - scope: "agent(orchestrator)"
          allowed:
            ["taxonomy", "contract(aggregate)", "contract(protocol)", "utility"]
          mandatory: ["taxonomy", "contract(aggregate)"]
          forbidden: ["surface", "capabilities", "root"]

        - scope: "root"
          allowed: ["taxonomy", "contract", "capabilities", "agent", "surface"]
          mandatory: []
          forbidden: []

        - scope: "surface(command|controller|page)"
          allowed: ["taxonomy", "contract(aggregate)", "utility"]
          mandatory: null
          forbidden: ["agent", "capabilities", "contract(protocol)", "root"]
          allowed_imports:
            - layer: "taxonomy"
              purpose: "implement"
            - layer: "contract(aggregate)"
              purpose: "call"
            - layer: "utility"
              purpose: "call"

        - scope: "surface(hook|store|action|screen|router)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            [
              "agent",
              "capabilities",
              "contract(protocol)",
              "surface(command|controller|page|entry)",
              "root",
            ]

        - scope: "surface(component|view|layout)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            [
              "agent",
              "contract",
              "capabilities",
              "surface(command|controller|page|entry|hook|store|action|screen|router)",
              "root",
            ]

    AES202:
      enabled: true
      scope:
        [
          "taxonomy",
          "utility",
          "contract",
          "capabilities",
          "agent",
          "surface",
          "root",
        ]
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "__init__.py",
          "__main__.py",
          "main.py",
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "main.ts",
          "main.js",
          "cli_main_entry.ts",
          "cli_main_entry.js",
          "mcp_main_entry.ts",
          "mcp_main_entry.js",
          "tui_main_entry.ts",
          "tui_main_entry.js",
        ]
      conditions:
        - scope: "taxonomy(vo)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "taxonomy(entity,error,event)"
          allowed: ["taxonomy"]
          mandatory: ["taxonomy(vo|constant)"]
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "taxonomy(constant)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "utility"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden: ["agent", "surface", "contract", "capabilities", "root", "utility"]

        - scope: "contract(protocol)"
          allowed: ["taxonomy", "contract"]
          mandatory: ["taxonomy"]
          forbidden:
            ["agent", "surface", "capabilities", "contract(aggregate)", "root"]

        - scope: "contract(aggregate)"
          allowed: ["taxonomy", "contract"]
          mandatory: ["taxonomy"]
          forbidden: ["agent", "surface", "capabilities", "root"]

        - scope: "capabilities"
          allowed: ["taxonomy", "contract", "utility"]
          mandatory: ["taxonomy", "contract(protocol)"]
          forbidden: ["surface", "agent", "capabilities", "root"]
          allowed_imports:
            - layer: "taxonomy"
              purpose: "implement"
            - layer: "contract(protocol)"
              purpose: "implement"
            - layer: "utility"
              purpose: "call"

        - scope: "agent(orchestrator)"
          allowed:
            ["taxonomy", "contract(aggregate)", "contract(protocol)", "utility"]
          mandatory: ["taxonomy", "contract(aggregate)"]
          forbidden: ["surface", "capabilities", "root"]

        - scope: "root"
          allowed: ["taxonomy", "contract", "capabilities", "agent", "surface"]
          mandatory: []
          forbidden: []

        - scope: "surface(command|controller|page)"
          allowed: ["taxonomy", "contract(aggregate)", "utility"]
          mandatory: null
          forbidden: ["agent", "capabilities", "contract(protocol)", "root"]

        - scope: "surface(hook|store|action|screen|router)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            [
              "agent",
              "capabilities",
              "contract(protocol)",
              "surface(command|controller|page|entry)",
              "root",
            ]

        - scope: "surface(component|view|layout)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            [
              "agent",
              "contract",
              "capabilities",
              "surface(command|controller|page|entry|hook|store|action|screen|router)",
              "root",
            ]

    AES203:
      enabled: true
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "root_cli_main_entry.rs",
          "root_mcp_main_entry.rs",
          "root_tui_main_entry.rs",
        ]

    AES204:
      enabled: true
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]
      exceptions: ["main.rs", "lib.rs", "mod.rs"]

    AES205:
      enabled: true
      exceptions: ["main.rs", "lib.rs", "mod.rs", "surface_mcp_action_command.rs", "root_auto_fix_container.rs", "agent_fix_orchestrator.rs"]
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]

    # ─── AES300: Code Quality ───
    AES301:
      enabled: true
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]
      max_lines: 1000
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "__init__.py",
          "__main__.py",
          "main.py",
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "cli_main_entry.ts",
          "cli_main_entry.js",
          "mcp_main_entry.ts",
          "mcp_main_entry.js",
          "tui_main_entry.ts",
          "tui_main_entry.js",
          "agent_filesystem_orchestrator.rs",
        ]

    AES302:
      enabled: true
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]
      min_lines: 5
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "__init__.py",
          "__main__.py",
          "main.py",
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "cli_main_entry.ts",
          "cli_main_entry.js",
          "mcp_main_entry.ts",
          "mcp_main_entry.js",
          "tui_main_entry.ts",
          "tui_main_entry.js",
        ]

    AES303:
      enabled: true
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "__init__.py",
          "__main__.py",
          "main.py",
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "main.ts",
          "main.js",
        ]

    AES304:
      enabled: true
      scope:
        [
          "taxonomy",
          "utility",
          "contract",
          "capabilities",
          "agent",
          "surface",
          "root",
        ]
      forbidden_bypass:
        [
          "#[allow(",
          "unwrap",
          "expect",
          "panic",
          "todo",
          "unimplemented",
          "unreachable",
          "noqa",
          "type: ignore",
          "eslint-disable",
          "// @ts-ignore",
          "// @ts-expect-error",
          "// @ts-nocheck",
        ]
      exceptions: ["main.rs", "lib.rs", "mod.rs"]

    AES305:
      enabled: true
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "surface_check_command.rs",
          "surface_external_action.rs",
          "surface_import_action.rs",
          "surface_naming_action.rs",
          "surface_orphan_action.rs",
          "surface_quality_action.rs",
          "surface_role_action.rs",
          "capabilities_orchestration_helpers.rs",
        ]

    # ─── AES400: Role ───
    AES401:
      enabled: true
      scope:
        ["taxonomy(constant)", "taxonomy(entity,error,event)", "taxonomy(vo)"]
      exceptions: ["taxonomy_adapter_error.rs"]

    AES402:
      enabled: true
      scope: ["contract(aggregate)", "contract(protocol)"]
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "__init__.py",
          "__main__.py",
          "main.py",
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "cli_main_entry.ts",
          "cli_main_entry.js",
          "mcp_main_entry.ts",
          "mcp_main_entry.js",
          "tui_main_entry.ts",
          "tui_main_entry.js",
          "contract_filesystem_io_protocol.rs",
          "contract_graph_protocol.rs",
          "contract_workspace_protocol.rs",
          "contract_maintenance_aggregate.rs",
          "contract_maintenance_protocol.rs",
          "contract_setup_protocol.rs",
          "contract_code_analysis_aggregate.rs",
          "contract_fix_aggregate.rs",
        ]

    AES403:
      enabled: true
      scope: ["capabilities"]
      max_functions: 30
      max_impl: 5
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "__init__.py",
          "__main__.py",
          "main.py",
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "cli_main_entry.ts",
          "cli_main_entry.js",
          "mcp_main_entry.ts",
          "mcp_main_entry.js",
          "tui_main_entry.ts",
          "tui_main_entry.js",
          "capabilities_orchestration_helpers.rs",
        ]

    AES404:
      enabled: true
      scope: ["utility"]
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "__init__.py",
          "__main__.py",
          "main.py",
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "cli_main_entry.ts",
          "cli_main_entry.js",
          "mcp_main_entry.ts",
          "mcp_main_entry.js",
          "tui_main_entry.ts",
          "tui_main_entry.js",
          "utility_rust_parser.rs",
          "utility_code_duplication_detector.rs",
        ]

    AES405:
      enabled: true
      scope: ["agent(orchestrator)"]
      max_lines: 1000
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "__init__.py",
          "__main__.py",
          "main.py",
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "cli_main_entry.ts",
          "cli_main_entry.js",
          "mcp_main_entry.ts",
          "mcp_main_entry.js",
          "tui_main_entry.ts",
          "tui_main_entry.js",
          "agent_filesystem_orchestrator_helpers.rs",
        ]

    AES406:
      enabled: true
      scope:
        [
          "surface(command|controller|page|router|entry)",
          "surface(hook|store|action|screen)",
          "surface(component|view|layout)",
        ]
      max_functions: 15
      exceptions:
        [
          "main.rs",
          "lib.rs",
          "mod.rs",
          "__init__.py",
          "__main__.py",
          "main.py",
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "cli_main_entry.ts",
          "cli_main_entry.js",
          "mcp_main_entry.ts",
          "mcp_main_entry.js",
          "tui_main_entry.ts",
          "tui_main_entry.js",
          "utility_output_text_formatter.rs",
        ]

    # ─── AES500: Orphan ───
    AES501:
      enabled: true
      scope: ["taxonomy"]
      entry_points:
        [
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "main.ts",
          "main.js",
        ]

    AES502:
      enabled: true
      scope: ["contract"]
      entry_points:
        [
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "main.ts",
          "main.js",
        ]

    AES503:
      enabled: true
      scope: ["capabilities"]
      entry_points:
        [
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "main.ts",
          "main.js",
        ]

    AES504:
      enabled: true
      scope: ["utility"]
      entry_points:
        [
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "main.ts",
          "main.js",
        ]

    AES505:
      enabled: true
      scope: ["agent"]
      entry_points:
        [
          "index.ts",
          "index.js",
          "index.tsx",
          "index.jsx",
          "main.ts",
          "main.js",
        ]

    AES506:
      enabled: true
      scope: ["surface"]
