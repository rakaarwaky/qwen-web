<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Qwen</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  .sidebar { width: 240px; background: #f5f5f5; height: 100vh; float: left; padding: 12px; }
  .main { margin-left: 240px; padding: 24px; }
  .message-input-textarea {
    width: 600px; height: 60px; border: 1px solid #ccc; border-radius: 20px;
    padding: 12px; font-size: 15px; resize: none;
  }
  .mode-select-open {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%; background: #fff;
    border: 1px solid #ccc; cursor: pointer; font-size: 20px;
  }
  .mode-select-dropdown {
    display: none; position: absolute; background: #fff; border: 1px solid #ddd;
    border-radius: 8px; padding: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .mode-select-dropdown.open { display: block; }
  .mode-select-dropdown-item {
    padding: 8px 12px; cursor: pointer; border-radius: 6px;
  }
  .mode-select-dropdown-item:hover { background: #f0f0f0; }
  button[aria-label*='Send'] {
    width: 40px; height: 36px; border-radius: 50%; background: #1677ff;
    border: none; color: #fff; cursor: pointer;
  }
  button[aria-label*='Send'][disabled] { background: #b0c4de; cursor: default; }
  #filesUpload { display: none; }
  .message-input-column-file {
    display: none; border: 1px solid #ddd; border-radius: 8px; padding: 8px;
    width: 300px; margin-top: 8px;
  }
  .message-input-column-file.visible { display: block; }
  .fileitem-btn { font-weight: 600; }
  .fileitem-file-size { color: #888; font-size: 12px; }
  .markdown-body { white-space: pre-wrap; border-left: 3px solid #1677ff; padding: 8px; margin: 8px 0; }
  .assistant .markdown-body { border-color: #52c41a; }
  .ant-message-error {
    display: none; background: #fff2f0; border: 1px solid #ffccc7; padding: 8px; border-radius: 6px;
  }
  .ant-message-error.visible { display: block; }
  .spinner { display: none; }
  .spinner.visible { display: inline-block; }
  .thinking { display: none; }
  .thinking.visible { display: block; }
</style>
</head>
<body>
  <div class="sidebar">
    <button aria-label="New Chat">+ New Chat</button>
  </div>
  <div class="main">
    <h2>What can I help you with today?</h2>

    <!-- hidden file input (mirrors dead #filesUpload; kept for parity, script no longer uses it) -->
    <input id="filesUpload" type="file" />

    <div class="message-input-column-file" id="attachmentCard">
      <div class="fileitem-btn"><span id="attName">doc.md</span></div>
      <div class="fileitem-file-size" id="attSize">0 B</div>
      <div class="fileitem-file-size" id="attStatus">Parsing...</div>
    </div>

    <div class="input-row">
      <div class="mode-select-open" id="modeSelect" title="Add">+</div>
      <div class="mode-select-dropdown" id="modeDropdown">
        <div class="mode-select-dropdown-item" data-action="upload">
          <span>Upload attachment</span>
          <span class="mode-select-dropdown-item-description">file,image,video,audio</span>
        </div>
      </div>
      <textarea class="message-input-textarea" id="chatInput"
                placeholder="How can I help you today?"></textarea>
      <button aria-label="Send" id="sendBtn">↑</button>
    </div>

    <div class="spinner" id="spinner">loading</div>
    <div class="thinking" id="thinking">Thinking…</div>

    <div id="chatLog"></div>

    <div class="ant-message-error" id="toastError"></div>
  </div>

<script>
  // ---- state mirroring the real Qwen UI behaviors we verified ----
  const $ = (id) => document.getElementById(id);
  const chatInput = $("chatInput");
  const sendBtn = $("sendBtn");
  const attachmentCard = $("attachmentCard");
  const modeSelect = $("modeSelect");
  const modeDropdown = $("modeDropdown");
  const attStatus = $("attStatus");

  function syncSendEnabled() {
    const hasText = chatInput.value.trim().length > 0;
    const hasFile = attachmentCard.classList.contains("visible");
    sendBtn.disabled = !(hasText || hasFile);
  }

  chatInput.addEventListener("input", syncSendEnabled);

  // mode-select open/close
  modeSelect.addEventListener("click", () => modeDropdown.classList.toggle("open"));
  document.addEventListener("click", (e) => {
    if (!modeSelect.contains(e.target) && !modeDropdown.contains(e.target)) {
      modeDropdown.classList.remove("open");
    }
  });

  // "Upload attachment" -> trigger a native file chooser via the hidden #filesUpload
  const uploadItem = document.querySelector(".mode-select-dropdown-item[data-action='upload']");
  uploadItem.addEventListener("click", () => {
    modeDropdown.classList.remove("open");
    $("filesUpload").click();
  });

  $("filesUpload").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    $("attName").textContent = file.name;
    $("attSize").textContent = file.size + " B";
    attStatus.textContent = "Parsing...";
    attachmentCard.classList.add("visible");
    syncSendEnabled();
    // simulate Qwen finishing parse after a short delay
    setTimeout(() => { attStatus.textContent = "Ready"; syncSendEnabled(); }, 600);
  });

  // Send button -> emulate dispatch + assistant reply
  sendBtn.addEventListener("click", () => {
    if (sendBtn.disabled) return;
    const promptText = chatInput.value;
    const log = $("chatLog");
    const userMsg = document.createElement("div");
    userMsg.className = "markdown-body user";
    userMsg.textContent = promptText;
    log.appendChild(userMsg);

    const thinking = $("thinking");
    thinking.classList.add("visible");
    setTimeout(() => {
      thinking.classList.remove("visible");
      const reply = document.createElement("div");
      reply.className = "assistant";
      const mb = document.createElement("div");
      mb.className = "markdown-body";
      mb.textContent = "Yes, I received the attached file and can read it.";
      reply.appendChild(mb);
      log.appendChild(reply);
      chatInput.value = "";
      attachmentCard.classList.remove("visible");
      syncSendEnabled();
    }, 700);
  });
</script>
</body>
</html>
