[tool.mypy]
strict = true
python_version = "3.10"

# Add src/ to mypy path so relative imports resolve
mypy_path = "src"

# Follow import resolution
follow_imports = "silent"
ignore_missing_imports = false

# Strictness flags (all enabled by strict=true, shown explicitly)
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
disallow_incomplete_defs = true
check_untyped_defs = true

# No implicit optional (correct snake_case)
no_implicit_optional = true

# Warn on unused ignores and type ignore comments
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Refuse unsafe __all__ in __init__.py
strict_equality = true

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
