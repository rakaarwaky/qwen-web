[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-web-cli"
version = "4.0.0"
description = "Production-grade CLI automation and MCP server for chat.qwen.ai"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "playwright>=1.62.0",
    "structlog>=26.1.0",
    "sentry-sdk>=2.66.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "tenacity>=9.1.4",
    "mcp>=2.0.0",
]

[project.scripts]
qwen-web-cli = "modules.root_cli_main_entry:main"
qwc = "modules.root_cli_main_entry:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "RUF100"]
ignore = [
    "E501",     # long lines acceptable for DOM selector strings
    "BLE001",   # blind exception - intentional for browser automation safety
    "S110",     # try-except-pass - intentional for cleanup/guard patterns
    "S112",     # try-except-continue - intentional for element scanning loops
    "PYI034",   # __enter__ return type - Self requires typing_extensions on py310
]
[tool.mypy]
strict = true
python_version = "3.10"

follow_imports = "silent"
ignore_missing_imports = false

disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["playwright.*", "tenacity.*", "structlog.*", "sentry_sdk.*", "mcp.*", "fastmcp.*"]
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
