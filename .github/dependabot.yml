version: 2
updates:
  # Python dependencies — pyproject.toml + uv.lock are the source of truth
  # (CI installs via `uv sync`, so Dependabot must update the lockfile too,
  # which only the `uv` ecosystem does).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      python:
        patterns:
          - "*"

  # GitHub Actions pinned by commit SHA in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-ci)"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
